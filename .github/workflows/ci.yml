name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features

      # Level 1 (unit and property), level 2 (fault injection over the commit)
      # and level 3 (canonical case end to end) all run here. Level 2 kills the
      # real binary with SIGABRT at each point of the commit and checks that the
      # store is left published or not published, never halfway.
      - name: Test
        run: cargo test --all-features --workspace
