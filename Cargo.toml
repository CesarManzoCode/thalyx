[workspace]
resolver = "3"
members = [
    "crates/thalyx-abi",
    "crates/thalyx-manifest",
    "crates/thalyx-parser",
    "crates/thalyx-contract",
    "crates/thalyx-agent",
    "crates/thalyx-permd",
    "crates/thalyx-syscall",
    "crates/thalyx-bpf",
    "crates/thalyx-btrfs",
    "crates/thalyx-install",
    "crates/thalyx-sandbox",
    "crates/thalyx-graph",
    "crates/thalyx-memory",
    "crates/thalyx-watch",
    "crates/thalyx-journal",
    "crates/thalyx-snapshot",
    "crates/thalyx-files",
    "crates/thalyx-term",
    "crates/thalyx-edit",
    "crates/thalyx-proc",
    "crates/thalyx-net",
    "crates/thalyx-core",
    "crates/thalyx-cli",
    "modules/dev.thalyx.greeter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/CesarManzoCode/thalyx"

[workspace.dependencies]
thalyx-abi = { path = "crates/thalyx-abi" }
thalyx-manifest = { path = "crates/thalyx-manifest" }
thalyx-parser = { path = "crates/thalyx-parser" }
thalyx-contract = { path = "crates/thalyx-contract" }
thalyx-agent = { path = "crates/thalyx-agent" }
thalyx-permd = { path = "crates/thalyx-permd" }
thalyx-sandbox = { path = "crates/thalyx-sandbox" }
thalyx-syscall = { path = "crates/thalyx-syscall" }
thalyx-bpf = { path = "crates/thalyx-bpf" }
thalyx-btrfs = { path = "crates/thalyx-btrfs" }
thalyx-install = { path = "crates/thalyx-install" }
thalyx-graph = { path = "crates/thalyx-graph" }
thalyx-memory = { path = "crates/thalyx-memory" }
thalyx-watch = { path = "crates/thalyx-watch" }
thalyx-journal = { path = "crates/thalyx-journal" }
thalyx-snapshot = { path = "crates/thalyx-snapshot" }
thalyx-files = { path = "crates/thalyx-files" }
thalyx-proc = { path = "crates/thalyx-proc" }
thalyx-net = { path = "crates/thalyx-net" }
thalyx-term = { path = "crates/thalyx-term" }
thalyx-edit = { path = "crates/thalyx-edit" }
thalyx-core = { path = "crates/thalyx-core" }

serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
toml = "0.9"
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
semver = "1"
# `bundled` compiles SQLite from source into the binary instead of linking the
# system's.
#
# Required, not preferred: the image holds the Linux kernel and one program, so
# there is no libsqlite3 on disk to link against, and a static musl build cannot
# borrow the host's. Compiling it in is what makes the graph index and the
# persistent memory exist inside `thalyx` rather than beside it — which is what
# the founding decree says of everything.
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
libc = "0.2"
time = { version = "0.3", features = ["formatting", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
