[package]
name = "thalyx-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thalyx-contract.workspace = true
thalyx-manifest.workspace = true
thalyx-memory.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
toml.workspace = true
# The prompt and the grammar are written to files rather than passed as
# arguments: a fetched README goes in the prompt, and an argument list is a
# place where a long one gets truncated by the kernel instead of by us.
tempfile.workspace = true
thiserror.workspace = true
# For the per-invocation marker that says where the model's answer starts. A
# fixed one would be a string a fetched page could contain.
uuid.workspace = true

[dev-dependencies]
thalyx-core = { workspace = true, features = ["test-support"] }
thalyx-memory.workspace = true

[lints]
workspace = true
