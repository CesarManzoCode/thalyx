[package]
name = "thalyx-program"
description = "The programmable transaction: a short program from a model, run locally with capabilities and no authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# QuickJS, compiled in.
#
# The same argument the workspace makes for `rusqlite`'s `bundled`, for the
# same reason: the image holds the Linux kernel and one program, so there is no
# shared library on disk to link against and a static musl build cannot borrow
# the host's. Compiling it in is what makes the runtime live *inside* `thalyx`
# rather than beside it.
#
# Default features only — `bindgen` is deliberately off: `rquickjs-sys` ships
# generated bindings for `x86_64-unknown-linux-musl`, which is the image's
# target, and turning bindgen on would make the image build need libclang.
rquickjs = "0.12"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
